<div
  *ngIf="dailyGoal"
  class="p-4 rounded-lg flex flex-col justify-between gap-2 h-full cursor-pointer"
  id="goal-card"
>
  <div class="flex justify-between">
    <span class="inline-block text-red-700">{{ dailyGoal.deadline }}</span>
    <span
      class="inline-block rounded-lg p-2 italic"
      [class]="getPriorityStyleClass(dailyGoal.priority)"
      >{{ dailyGoal.priority | uppercase }}</span
    >
  </div>
  <h2
    class="text-center m-4 sm:text-2xl md:text-3xl lg:text-3xl xl:text-4xl hover:underline hover:text-blue-500"
    [routerLink]="['/weeklylyGoal', dailyGoal.id]"
  >
    {{ dailyGoal.title | titlecase }}
  </h2>
  <p class="text-sm">{{ dailyGoal.description }}</p>

  <div class="flex justify-between">
    <span class="inline-block">{{ dailyGoal.progress * 10 }}%</span>
    <div class="flex justify-between gap-2" id="goal-options">
      <mat-icon
        (click)="showEditModal()"
        class="text-blue-500 cursor-pointer"
        title="Edit"
        aria-hidden="false"
        aria-label="edit icon"
        fontIcon="edit"
      ></mat-icon>
      <mat-icon
        class="text-red-500 cursor-pointer"
        title="Delete"
        aria-hidden="false"
        aria-label="delete icon"
        fontIcon="delete"
        (click)="deleteGoal(dailyGoal.id)"
      ></mat-icon>
    </div>
  </div>
  <mat-progress-bar
    mode="determinate"
    [value]="dailyGoal.progress * 10"
  ></mat-progress-bar>
</div>
