<div
  *ngIf="weeklyGoal"
  class="p-4 rounded-lg flex flex-col justify-between gap-2 h-full cursor-pointer"
  id="goal-card"
>
  <div class="flex justify-between">
    <span class="inline-block text-red-700">{{ weeklyGoal.deadline }}</span>
    <span class="inline-block text-blue-600 " *ngIf="index || index==0" >Week {{ index + 1 }}</span>
    <!-- <span
      class="inline-block rounded-lg p-2 italic"
      [class]="getPriorityStyleClass(weeklyGoal.priority)"
      >{{ weeklyGoal.priority | uppercase }}</span
    > -->
  </div>
  <h2 class="text-center m-4 sm:text-2xl md:text-3xl lg:text-3xl xl:text-4xl  hover:underline hover:text-blue-500" [routerLink]="['/weeklyGoal', weeklyGoal.id]"
  >
    {{ weeklyGoal.title | titlecase }}
  </h2>
  <p class="text-sm text-gray-600">{{ weeklyGoal.description }}</p>

  <div class="flex justify-between">
    <span class="inline-block">{{ weeklyGoal.progress * 10 }}%</span>
    <div class="flex justify-between gap-2" id="goal-options">
      <mat-icon
        (click)="showEditModal()"
        class="text-blue-500 cursor-pointer"
        title="Edit"
        aria-hidden="false"
        aria-label="edit icon"
        fontIcon="edit"
      ></mat-icon>
      <mat-icon
        class="text-red-500 cursor-pointer"
        title="Delete"
        aria-hidden="false"
        aria-label="delete icon"
        fontIcon="delete"
        (click)="deleteGoal(weeklyGoal.id)"
      ></mat-icon>
    </div>
  </div>
  <mat-progress-bar
    mode="determinate"
    [value]="weeklyGoal.progress * 10"
  ></mat-progress-bar>
</div>
