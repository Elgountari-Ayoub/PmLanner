<app-navbar></app-navbar>
<app-sidebar></app-sidebar>
<div class="sm:ml-64">
  <div class="rounded-lg mt-14 80vh">
    <div class="p-4" *ngIf="monthlyGoal.weeklyGoals">
      <mat-icon
      *ngIf="monthlyGoal.weeklyGoals.length < 4"
        class="text-blue-500 cursor-pointer"
        title="Create Weekly Goal"
        aria-hidden="false"
        aria-label="create icon"
        fontIcon="add_circle"
        type="button"
        (click)="showWeeklyGoalCreateModal()"
      ></mat-icon>

      <div
        class="grid gap-4 mt-4 grid-cols-1 md-grid-cols-2 lg:grid-cols-2 md:mx-4 lg:mx-8 xl:mx-12"
        *ngIf="monthlyGoal"
      >
        <app-weekly-goal
          *ngFor="let weeklyGoal of monthlyGoal.weeklyGoals; let i = index"
          [weeklyGoal]="weeklyGoal"
          [index]="i"
          (goalDeleted)="getMonthlyGoal(monthlyGoalId)"
          (showEditGoalModal)="showWeeklyGoalEditModal(weeklyGoal)"
          class="rounded-lg mx-2 hover:shadow-goal hover:scale-101 transition ease-linear delay-150"
          [class]="getGoalCardStyleClass(i)"
        ></app-weekly-goal>
      </div>

      <!------------------------------ Weekly Goal Modals ------------------------------>
      <!-- Weekly Goal Create modal -->
      <div
        id="weekly-goal-create-modal"
        tabindex="-1"
        aria-hidden="true"
        class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full"
      >
        <div class="relative p-4 mt-8 w-full max-w-lg max-h-full">
          <!-- Modal content -->
          <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
            <!-- Modal header -->
            <div
              class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600"
            >
              <h3 class="text-lg font-semibold text-gray-900 dark:text-white">
                Create New Weekly Goal
              </h3>
              <button
                type="button"
                class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white"
                (click)="hideWeeklyGoalCreatelModal()"
              >
                <svg
                  class="w-3 h-3"
                  aria-hidden="true"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 14 14"
                >
                  <path
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"
                  />
                </svg>
                <span class="sr-only">Close modal</span>
              </button>
            </div>
            <!-- Modal body -->
            <form
              class="p-4 md:p-5"
              [formGroup]="weeklyGoalCreateForm"
              (ngSubmit)="createWeeklyGoal()"
            >
              <div class="grid gap-4 mb-4 grid-cols-1">
                <div>
                  <label
                    for="title"
                    class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                    >Title</label
                  >
                  <input
                    type="text"
                    formControlName="title"
                    id="title"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                    placeholder="Enter goal title"
                    required=""
                  />
                  <div
                    *ngIf="
                      weeklyGoalCreateForm.get('title')?.hasError('required') &&
                      weeklyGoalCreateForm.get('title')?.touched
                    "
                    class="p-1 bg-red-500 text-white text-xs mt-1 rounded"
                  >
                    Title is required.
                  </div>
                </div>
                <div>
                  <label
                    for="description"
                    class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                    >Description</label
                  >
                  <textarea
                    formControlName="description"
                    id="description"
                    rows="4"
                    class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                    placeholder="Enter goal description"
                  ></textarea>
                  <div
                    *ngIf="
                      weeklyGoalCreateForm
                        .get('description')
                        ?.hasError('required') &&
                      weeklyGoalCreateForm.get('description')?.touched
                    "
                    class="p-1 bg-red-500 text-white text-xs mt-1 rounded"
                  >
                    Description is required.
                  </div>
                </div>
                <div>
                  <label
                    for="deadline"
                    class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                    >Deadline</label
                  >
                  <input
                    type="date"
                    formControlName="deadline"
                    id="deadline"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                    placeholder="Select deadline"
                  />
                  <div
                    *ngIf="
                      weeklyGoalCreateForm
                        .get('deadline')
                        ?.hasError('required') &&
                      weeklyGoalCreateForm.get('deadline')?.touched
                    "
                    class="p-1 bg-red-500 text-white text-xs mt-1 rounded"
                  >
                    Deadline is required.
                  </div>
                  <div
                  *ngIf="weeklyGoalCreateForm.get('deadline')?.errors?.['futureDate']"
                  class="p-1 bg-red-500 text-white text-xs mt-1 rounded"
                >
                  Deadline must be a future date.
                </div>
                </div>
                <div>
                  <label
                    for="priority"
                    class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                    >Priority</label
                  >
                  <select
                    formControlName="priority"
                    id="priority"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                  >
                    <option
                      *ngFor="let priority of priorities"
                      [value]="priority"
                    >
                      {{ priority }}
                    </option>
                  </select>
                  <div
                    *ngIf="
                      weeklyGoalCreateForm
                        .get('priority')
                        ?.hasError('required') &&
                      weeklyGoalCreateForm.get('priority')?.touched
                    "
                    class="p-1 bg-red-500 text-white text-xs mt-1 rounded"
                  >
                    Priority is required.
                  </div>
                </div>
              </div>

              <button
                type="submit"
                [disabled]="weeklyGoalCreateForm.invalid"
                class="text-white inline-flex items-center bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800"
              >
                <svg
                  class="me-1 -ms-1 w-5 h-5"
                  fill="currentColor"
                  viewBox="0 0 20 20"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    fill-rule="evenodd"
                    d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z"
                    clip-rule="evenodd"
                  ></path>
                </svg>
                Add New Weekly Goal
              </button>
            </form>
          </div>
        </div>
      </div>

      <!-- Weekly Goal Edit modal -->
      <div
        id="weekly-goal-edit-modal"
        tabindex="-1"
        aria-hidden="true"
        class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full"
      >
        <div class="relative p-4 mt-8 w-full max-w-lg max-h-full">
          <!-- Modal content -->
          <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
            <!-- Modal header -->
            <div
              class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600"
            >
              <h3 class="text-lg font-semibold text-gray-900 dark:text-white">
                Edit Monthly Goal
              </h3>
              <button
                (click)="hideWeeklyGoalEditlModal()"
                type="button"
                class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white"
              >
                <svg
                  class="w-3 h-3"
                  aria-hidden="true"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 14 14"
                >
                  <path
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"
                  />
                </svg>
                <span class="sr-only">Close modal</span>
              </button>
            </div>
            <!-- Modal body -->
            <form
              class="p-4 md:p-5"
              [formGroup]="weeklyGoalEditForm"
              (ngSubmit)="editWeeklyGoal()"
            >
              <div class="grid gap-4 mb-4 grid-cols-1">
                <div>
                  <label
                    for="title"
                    class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                    >Title</label
                  >
                  <input
                    type="text"
                    formControlName="title"
                    id="title"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                    placeholder="Enter goal title"
                    required=""
                  />
                </div>
                <div>
                  <label
                    for="description"
                    class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                    >Description</label
                  >
                  <textarea
                    formControlName="description"
                    id="description"
                    rows="4"
                    class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                    placeholder="Enter goal description"
                  ></textarea>
                </div>
                <div>
                  <label
                    for="deadline"
                    class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                    >Deadline</label
                  >
                  <input
                    type="date"
                    formControlName="deadline"
                    id="deadline"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                    placeholder="Select deadline"
                    required=""
                  />
                </div>
                <div>
                  <label
                    for="priority"
                    class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                    >Priority</label
                  >
                  <select
                    formControlName="priority"
                    id="priority"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                  >
                    <option
                      *ngFor="let priority of priorities"
                      [value]="priority"
                    >
                      {{ priority }}
                    </option>
                  </select>
                </div>
              </div>
              <div>
                <label
                  for="monthlyGoal"
                  class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                  >Select Momthly Goal</label
                >
                <select
                  disabled
                  id="monthlyGoal"
                  class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                >
                  <option
                    *ngFor="let monthlyGoal of monthlyGoals"
                    [ngValue]="monthlyGoal"
                  >
                    {{ monthlyGoal.title }}
                  </option>
                </select>
              </div>
              <!-- [disabled]="weeklyGoalEditForm.invalid" -->
              <button
                type="submit"
                class="text-white inline-flex items-center mt-2 bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800"
              >
                Update Weekly Goal
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
